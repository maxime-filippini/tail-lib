name: CI

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
      - main
      
permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint with ruff
        run: uv run --locked ruff check

      - name: Check formatting with ruff
        run: uv run --locked ruff format --check

      - name: Type check with ty
        run: uv run --locked ty check

  test:
    name: Python ${{ matrix.python-version }} / NumPy ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            tox-version: "312"
            numpy: min
          - python-version: "3.13"
            tox-version: "313"
            numpy: min
          - python-version: "3.14"
            tox-version: "314"
            numpy: min
          - python-version: "3.12"
            tox-version: "312"
            numpy: latest
          - python-version: "3.13"
            tox-version: "313"
            numpy: latest
          - python-version: "3.14"
            tox-version: "314"
            numpy: latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run tox environment
        run: uv tool run tox -e py${{ matrix.tox-version }}-numpy_${{ matrix.numpy }}

  build:
    name: Build wheel with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Strict: a warning, e.g. a broken link, fails the build.
      - name: Build the docs site
        run: uv run --locked --group docs zensical build --strict

      # Uploaded on every run, as the `github-pages` artifact, to inspect a
      # build. Only pushes to `develop` deploy it.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-docs:
    name: Deploy docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [lint, test, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push doesn't cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v5
