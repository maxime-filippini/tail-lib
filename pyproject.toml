[project]
name = "tail-lib"
description = "Risk measure computation library"
readme = "README.md"
authors = [{ name = "Maxime Filippini", email = "maxime.filippini@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2"]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=9.1.1"]
