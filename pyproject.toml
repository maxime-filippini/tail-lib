[project]
name = "tail-lib"
description = "Risk measure computation library"
readme = "README.md"
authors = [{ name = "Maxime Filippini", email = "maxime.filippini@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "pydantic>=2.13",
    "scipy>=1.18.1",
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.90",
]

[tool.ruff]
exclude = ["./.user"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ICN001",
    "CPY001",
    "D105",
    "D107",
    # Pick one of each pair of conflicting docstring rules: D211 and D212.
    "D203",
    "D213",
    # Conflicts with the formatter, which handles trailing commas.
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
# Tests are plain functions run by pytest: no docstrings, no package, and
# bare `assert` statements.
"tests/**" = ["D", "INP001", "S101"]

[tool.ruff.lint.isort]
force-single-line = true
