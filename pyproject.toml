[project]
name = "tail-lib"
description = "Risk measure computation library"
readme = "README.md"
authors = [{ name = "Maxime Filippini", email = "maxime.filippini@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.18.1"]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[tool.ruff]
exclude = ["./.user"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ICN001", "CPY001", "D105", "D107"]

[tool.ruff.isort]
force-single-line = true
