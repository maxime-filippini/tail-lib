# Documentation site, built with Zensical (https://zensical.org).
#
#   uv run --group docs zensical serve   # preview on http://localhost:8000
#   uv run --group docs zensical build   # write the site to `site/`

[project]
site_name = "tail-lib"
site_url = "https://maxime-filippini.github.io/tail-lib/"
site_description = "Market risk measures, and the backtesting and comparison of the models that compute them."
site_author = "Maxime Filippini"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    "guide/index.md",
    "guide/concepts.md",
    "guide/python-runs.md",
    "guide/specs.md",
    "guide/models.md",
    "guide/backtests.md",
    "guide/simulation.md",
  ] },
  { "API reference" = [
    "reference/index.md",
    "reference/run.md",
    "reference/context.md",
    "reference/specs.md",
    "reference/value-at-risk.md",
    "reference/volatility.md",
    "reference/ewma.md",
    "reference/mean.md",
    "reference/backtests.md",
    "reference/windows.md",
    "reference/time-series.md",
    "reference/simulation.md",
    "reference/graph.md",
    "reference/report.md",
  ] },
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# API reference, from the docstrings (Google style).
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_root_heading = true
show_root_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
